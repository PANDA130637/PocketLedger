name: iOS Build and Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project PocketLedger.xcodeproj -scheme PocketLedger             -destination "platform=iOS Simulator,id=$DEVICE_ID"             -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult             CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
